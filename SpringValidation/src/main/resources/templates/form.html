<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Login Here</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" 
integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" 
crossorigin="anonymous">
</head>

<body align="center" style="background: #e2e2e2">
<div class="container">
<div class="row mt-5">
<div class="col-md-6 offset-md-3">

<form th:action="@{/process}"  method="post"  class="bg-white p-4" th:object="${loginData}" >
<h1 align="center">Login Form</h1>
  <div class="form-group">
    <label for="exampleInputEmail1">User Name</label>
    <input type="text" name="username"  class="form-control" id="exampleInputUsername"  placeholder="Enter Username"
    th:value="${loginData.username}" 
    th:classappend="${#fields.hasErrors('username')?'is-invalid':''}"
    >
    <div th:each="e : ${#fields.errors('username')}" th:text="${e}"  class="invalid-feedback">Please Provide a Valid UserName</div>
  </div>
  
  
  <div class="form-group">
    <label for="exampleInputPassword1">User Email</label>
    <input type="text" name="email" class="form-control" id="exampleInputEmail1" placeholder="Enter Email Address"
     th:value="${loginData.email}" 
     th:classappend="${#fields.hasErrors('email')?'is-invalid':''}"
   >
     <div th:each="e : ${#fields.errors('email')}"  th:text="${e}"  class="invalid-feedback">Please Provide a Valid Email Address</div>
  </div>
   
   
  <div class="form-check form-check">
    <input  name="agreed"    type="checkbox" class="form-check-input" id="exampleCheck1"
    th:value="${loginData.agreed}" 
     th:classappend="${#fields.hasErrors('agreed')?'is-invalid':''}"
    >
    <label class="form-check-label" for="exampleCheck1">Agree Terms & Condition</label>
    <div th:each="e : ${#fields.errors('agreed')}"  th:text="${e}"  class="invalid-feedback"></div>
  </div>
  
  <div class="container text-center">
  <button type="submit" class="btn btn-primary">Submit</button>
  </div>
</form>


</div>
</div>
</div>
</body>
</html>
